<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Planner de cursada</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ECEFF5; --surface:#fff; --ink:#18202F; --muted:#667085; --line:#D9DEE8;
  --accent:#3B47D9; --accent-soft:#E4E6FB;
  --bad:#C8453F; --bad-soft:#F9E1DF;
  --ok:#B7791F; --ok-soft:#FBEFD2;
  --pro:#1F7A5C; --pro-soft:#D9F0E6;
}
*{box-sizing:border-box}
body{margin:0;font-family:"Bricolage Grotesque",system-ui,sans-serif;background:var(--bg);color:var(--ink);display:grid;grid-template-columns:260px 1fr;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

aside{background:var(--ink);color:#fff;padding:24px 18px;display:flex;flex-direction:column;gap:24px}
aside h1{font-size:20px;margin:0;font-weight:700}
nav{display:flex;flex-direction:column;gap:4px}
nav button{background:none;border:0;color:#B8C0D4;text-align:left;padding:10px 12px;border-radius:8px;font-size:15px}
nav button[aria-selected=true]{background:#2A3550;color:#fff}
.upcoming h2{font-size:13px;font-weight:500;color:#8E99B3;margin:0 0 8px}
.upcoming ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.upcoming li{background:#232D45;border-radius:8px;padding:8px 10px;font-size:13px}
.upcoming li b{display:block;font-weight:500}
.upcoming li span{color:#9AA5BE}
.upcoming .empty{color:#8E99B3;font-size:13px}
.backup{margin-top:auto;display:flex;flex-direction:column;gap:6px}
.backup h2{font-size:13px;font-weight:500;color:#8E99B3;margin:0 0 2px}
.backup button{background:#232D45;border:0;color:#DDE3F2;border-radius:8px;padding:8px 10px;font-size:13px;text-align:left}
.backup button:hover{background:#2A3550}

main{padding:28px;min-width:0}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.bar h2{margin:0;font-size:26px;font-weight:700;flex:1;min-width:160px;text-transform:capitalize}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 14px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:var(--bad)}

.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.dow{background:#F6F7FB;padding:8px;font-size:13px;color:var(--muted);text-align:center}
.day{background:var(--surface);min-height:104px;padding:6px;display:flex;flex-direction:column;gap:3px;cursor:pointer;text-align:left;border:0;border-radius:0}
.day:hover{background:#F8F9FD}
.day.out{background:#FAFBFD;color:#A4ABBB}
.day .n{font-size:13px;width:24px;height:24px;display:grid;place-items:center;border-radius:50%}
.day.today .n{background:var(--accent);color:#fff}
.chip{font-size:12px;line-height:1.25;padding:2px 6px;border-radius:5px;background:var(--accent-soft);color:#2630A0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-left:3px solid var(--accent)}
.chip.bad{background:var(--bad-soft);color:#8E2A25;border-color:var(--bad)}
.chip.ok{background:var(--ok-soft);color:#7A5010;border-color:var(--ok)}
.chip.pro{background:var(--pro-soft);color:#14513C;border-color:var(--pro)}

.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:14px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

dialog{border:0;border-radius:14px;padding:0;width:min(440px,92vw);box-shadow:0 20px 60px rgba(20,28,48,.3)}
dialog::backdrop{background:rgba(24,32,47,.45)}
dialog form{padding:22px;display:grid;gap:12px}
dialog h3{margin:0 0 4px;font-size:20px}
label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
input,select,textarea{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;font-size:15px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.actions .del{margin-right:auto}
.badge{font-size:13px;padding:6px 10px;border-radius:8px;display:none}
.mat-row{display:flex;gap:8px}
.mat-row select,.mat-row input{flex:1;min-width:0}
dialog .box{padding:22px;display:grid;gap:12px}
.mat-lista{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;max-height:260px;overflow-y:auto}
.mat-lista li{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#F6F7FB;border-radius:8px;padding:8px 10px;font-size:15px;color:var(--ink)}
.mat-lista li.vacio-mat{color:var(--muted);justify-content:center}
.mat-lista button{background:none;border:0;color:var(--muted);border-radius:6px;padding:2px 8px}
.mat-lista button:hover{background:var(--bad-soft);color:var(--bad)}
.badge.bad{display:block;background:var(--bad-soft);color:#8E2A25}
.badge.ok{display:block;background:var(--ok-soft);color:#7A5010}
.badge.pro{display:block;background:var(--pro-soft);color:#14513C}

.crumbs{display:flex;gap:6px;align-items:center;flex-wrap:wrap;flex:1;font-size:18px}
.crumbs button{background:none;border:0;padding:2px 4px;border-radius:6px;font-weight:500}
.crumbs button:hover{background:var(--accent-soft)}
.crumbs span{color:var(--muted)}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px;position:relative}
.item.folder{cursor:pointer}
.item.folder:hover{border-color:var(--accent)}
.item .ico{font-size:26px}
.item .name{font-weight:500;word-break:break-word}
.item .meta{font-size:12px;color:var(--muted)}
.item .x{position:absolute;top:8px;right:8px;background:none;border:0;color:var(--muted);font-size:16px;border-radius:6px;padding:2px 6px}
.item .x:hover{background:var(--bad-soft);color:var(--bad)}
.item a{color:var(--accent);font-size:13px}
.vacio{grid-column:1/-1;color:var(--muted);padding:40px 0;text-align:center;border:1px dashed var(--line);border-radius:12px}
.hidden{display:none}

@media (max-width:820px){
  body{grid-template-columns:1fr}
  aside{flex-direction:row;flex-wrap:wrap;align-items:center;padding:14px}
  .upcoming{display:none}
  main{padding:16px}
  .day{min-height:78px}
  .chip{font-size:11px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<aside>
  <h1>Calendario de cursada</h1>
  <nav role="tablist">
    <button role="tab" id="tab-cal" aria-selected="true">Calendario</button>
    <button role="tab" id="tab-arch" aria-selected="false">Archivos</button>
  </nav>
  <div class="upcoming">
    <h2>Pendientes próximos</h2>
    <ul id="upcoming"></ul>
  </div>
  <div class="backup">
    <h2>Copia de seguridad</h2>
    <button type="button" id="exportBtn">Exportar todo</button>
    <button type="button" id="importBtn">Importar copia</button>
    <input type="file" id="importInput" accept=".json,application/json" hidden>
  </div>
</aside>

<main>
  <!-- CALENDARIO -->
  <section id="view-cal">
    <div class="bar">
      <h2 id="monthTitle"></h2>
      <button class="btn" id="prev" aria-label="Mes anterior">‹</button>
      <button class="btn" id="today">Hoy</button>
      <button class="btn" id="next" aria-label="Mes siguiente">›</button>
      <button class="btn primary" id="addEvent">Nuevo evento</button>
    </div>
    <div class="grid" id="grid"></div>
    <div class="legend">
      <span><i style="background:var(--accent)"></i>Sin nota / sin definir</span>
      <span><i style="background:var(--bad)"></i>Desaprobado (1-3)</span>
      <span><i style="background:var(--ok)"></i>Aprobado (4-6) / TP sin entregar</span>
      <span><i style="background:var(--pro)"></i>Promoción (7-10) / TP entregado</span>
    </div>
  </section>

  <!-- ARCHIVOS -->
  <section id="view-arch" class="hidden">
    <div class="bar">
      <div class="crumbs" id="crumbs"></div>
      <button class="btn" id="newFolder">Nueva carpeta</button>
      <button class="btn primary" id="uploadBtn">Subir archivos</button>
      <input type="file" id="fileInput" multiple hidden>
    </div>
    <div class="items" id="items"></div>
  </section>
</main>

<dialog id="dlg">
  <form method="dialog" id="form">
    <h3 id="dlgTitle">Nuevo evento</h3>
    <div class="row">
      <label>Tipo
        <select id="f-tipo">
          <option value="parcial">Parcial</option>
          <option value="tp">TP</option>
          <option value="final">Final</option>
          <option value="otro">Otro</option>
        </select>
      </label>
      <label>Fecha <input type="date" id="f-fecha" required></label>
    </div>
    <label>Materia
      <span class="mat-row">
        <select id="f-materia" required></select>
        <button type="button" class="btn" id="manageMat">Editar lista</button>
      </span>
    </label>
    <label>Título <input id="f-titulo" placeholder="Ej: Parcial 1, TP Integrador"></label>
    <label id="l-nota">Nota
      <select id="f-nota">
        <option value="">Sin nota todavía</option>
        <option>1</option><option>2</option><option>3</option><option>4</option><option>5</option>
        <option>6</option><option>7</option><option>8</option><option>9</option><option>10</option>
      </select>
    </label>
    <div class="badge" id="badge"></div>
    <label id="l-estado">Estado del TP
      <select id="f-estado">
        <option value="sin">Sin entregar</option>
        <option value="entregado">Entregado</option>
      </select>
    </label>
    <label>Notas <textarea id="f-notas" rows="2"></textarea></label>
    <div class="actions">
      <button type="button" class="btn danger del" id="delBtn">Eliminar</button>
      <button type="button" class="btn" id="cancelBtn">Cancelar</button>
      <button type="submit" class="btn primary">Guardar</button>
    </div>
  </form>
</dialog>

<dialog id="dlgMat">
  <div class="box">
    <h3>Mis materias</h3>
    <div class="mat-row">
      <input id="matInput" placeholder="Nombre de la materia" autocomplete="off">
      <button type="button" class="btn primary" id="matAdd">Agregar</button>
    </div>
    <ul id="matLista" class="mat-lista"></ul>
    <div class="actions">
      <button type="button" class="btn primary" id="matClose">Listo</button>
    </div>
  </div>
</dialog>

<script>
/* ---------- Utilidades ---------- */
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, "0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const parseISO = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };

function estadoNota(n){
  n = Number(n);
  if (n <= 3) return {txt:"Desaprobado", cls:"bad"};
  if (n <= 6) return {txt:"Aprobado", cls:"ok"};
  return {txt:"Promoción", cls:"pro"};
}

/* ---------- Eventos (localStorage) ---------- */
let eventos = [];
try { eventos = JSON.parse(localStorage.getItem("planner-eventos") || "[]"); } catch(e){ eventos = []; }
const guardarEventos = () => { try { localStorage.setItem("planner-eventos", JSON.stringify(eventos)); } catch(e){ alert("No se pudo guardar."); } };

function claseEvento(ev){
  if (ev.tipo === "tp") return ev.estado === "entregado" ? "pro" : "ok";
  if (ev.tipo === "parcial" || ev.tipo === "final") return ev.nota ? estadoNota(ev.nota).cls : "";
  return "";
}
function etiquetaEvento(ev){
  const t = {parcial:"Parcial", tp:"TP", final:"Final", otro:""}[ev.tipo];
  let s = ev.materia + (ev.titulo ? " · " + ev.titulo : (t ? " · " + t : ""));
  if (ev.tipo === "tp") s += ev.estado === "entregado" ? " ✓" : " (sin entregar)";
  else if (ev.nota) s += " — " + ev.nota;
  return s;
}

/* ---------- Calendario ---------- */
let cur = new Date(); cur.setDate(1);
function renderCal(){
  const y = cur.getFullYear(), m = cur.getMonth();
  $("monthTitle").textContent = cur.toLocaleDateString("es-AR", {month:"long", year:"numeric"});
  const g = $("grid"); g.innerHTML = "";
  ["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"].forEach(d => { const e = document.createElement("div"); e.className = "dow"; e.textContent = d; g.appendChild(e); });
  const offset = (new Date(y, m, 1).getDay() + 6) % 7;
  const start = new Date(y, m, 1 - offset);
  const hoy = iso(new Date());
  for (let i = 0; i < 42; i++){
    const d = new Date(start); d.setDate(start.getDate() + i);
    if (i >= 35 && d.getMonth() !== m) break;
    const key = iso(d);
    const cell = document.createElement("button");
    cell.className = "day" + (d.getMonth() !== m ? " out" : "") + (key === hoy ? " today" : "");
    cell.innerHTML = `<span class="n">${d.getDate()}</span>`;
    eventos.filter(e => e.fecha === key).forEach(ev => {
      const c = document.createElement("div");
      c.className = "chip " + claseEvento(ev);
      c.textContent = etiquetaEvento(ev);
      c.title = c.textContent;
      c.onclick = e => { e.stopPropagation(); abrirDialogo(ev); };
      cell.appendChild(c);
    });
    cell.onclick = () => abrirDialogo(null, key);
    g.appendChild(cell);
  }
  renderUpcoming();
}
function renderUpcoming(){
  const ul = $("upcoming"); ul.innerHTML = "";
  const hoy = iso(new Date());
  const pend = eventos
    .filter(e => e.fecha >= hoy && ((e.tipo === "tp" && e.estado !== "entregado") || ((e.tipo === "parcial" || e.tipo === "final") && !e.nota) || e.tipo === "otro"))
    .sort((a,b) => a.fecha.localeCompare(b.fecha)).slice(0, 6);
  if (!pend.length){ ul.innerHTML = '<li class="empty">Nada pendiente. Agregá un evento desde el calendario.</li>'; return; }
  pend.forEach(e => {
    const li = document.createElement("li");
    const b = document.createElement("b"); b.textContent = e.materia + (e.titulo ? " · " + e.titulo : "");
    const s = document.createElement("span"); s.textContent = parseISO(e.fecha).toLocaleDateString("es-AR", {weekday:"short", day:"numeric", month:"short"});
    li.append(b, s); ul.appendChild(li);
  });
}
$("prev").onclick = () => { cur.setMonth(cur.getMonth() - 1); renderCal(); };
$("next").onclick = () => { cur.setMonth(cur.getMonth() + 1); renderCal(); };
$("today").onclick = () => { cur = new Date(); cur.setDate(1); renderCal(); };

/* ---------- Materias (localStorage) ---------- */
let materias = [];
try { materias = JSON.parse(localStorage.getItem("planner-materias") || "[]"); } catch(e){ materias = []; }
// Si ya tenías eventos cargados, sus materias pasan a la lista automáticamente
eventos.forEach(e => { if (e.materia && !materias.includes(e.materia)) materias.push(e.materia); });
const guardarMaterias = () => { try { localStorage.setItem("planner-materias", JSON.stringify(materias)); } catch(e){ alert("No se pudo guardar."); } };
guardarMaterias();

function llenarMaterias(sel){
  const s = $("f-materia"); s.innerHTML = "";
  s.add(new Option(materias.length ? "Elegí una materia" : "Primero agregá materias (Editar lista)", ""));
  const lista = [...materias].sort((a,b) => a.localeCompare(b));
  if (sel && !lista.includes(sel)) lista.push(sel); // materia ya borrada pero usada por este evento
  lista.forEach(m => s.add(new Option(m, m)));
  s.value = sel || "";
}
function renderMatLista(){
  const ul = $("matLista"); ul.innerHTML = "";
  if (!materias.length){ ul.innerHTML = '<li class="vacio-mat">Todavía no hay materias. Agregá la primera arriba.</li>'; return; }
  [...materias].sort((a,b) => a.localeCompare(b)).forEach(m => {
    const li = document.createElement("li");
    const sp = document.createElement("span"); sp.textContent = m;
    const x = document.createElement("button"); x.type = "button"; x.textContent = "✕"; x.title = "Eliminar materia"; x.setAttribute("aria-label", "Eliminar " + m);
    x.onclick = () => {
      const usados = eventos.filter(e => e.materia === m).length;
      const aviso = usados ? `\n\nLos ${usados} eventos de esta materia se conservan con su nombre.` : "";
      if (!confirm(`¿Eliminar "${m}" de la lista?${aviso}`)) return;
      materias = materias.filter(x => x !== m); guardarMaterias();
      renderMatLista(); llenarMaterias($("f-materia").value);
    };
    li.append(sp, x); ul.appendChild(li);
  });
}
function agregarMateria(){
  const v = $("matInput").value.trim(); if (!v) return;
  if (materias.some(m => m.toLowerCase() === v.toLowerCase())){ alert("Esa materia ya está en la lista."); return; }
  materias.push(v); guardarMaterias();
  $("matInput").value = ""; renderMatLista(); llenarMaterias(v); $("matInput").focus();
}
$("manageMat").onclick = () => { renderMatLista(); $("dlgMat").showModal(); $("matInput").focus(); };
$("matAdd").onclick = agregarMateria;
$("matInput").addEventListener("keydown", e => { if (e.key === "Enter"){ e.preventDefault(); agregarMateria(); } });
$("matClose").onclick = () => $("dlgMat").close();

/* ---------- Diálogo de evento ---------- */
const dlg = $("dlg");
let editId = null;
function actualizarCampos(){
  const t = $("f-tipo").value;
  $("l-nota").classList.toggle("hidden", !(t === "parcial" || t === "final"));
  $("l-estado").classList.toggle("hidden", t !== "tp");
  const b = $("badge"), n = $("f-nota").value;
  if ((t === "parcial" || t === "final") && n){ const e = estadoNota(n); b.className = "badge " + e.cls; b.textContent = e.txt; }
  else { b.className = "badge"; b.textContent = ""; }
}
["f-tipo","f-nota"].forEach(id => $(id).addEventListener("change", actualizarCampos));
function abrirDialogo(ev, fecha){
  editId = ev ? ev.id : null;
  $("dlgTitle").textContent = ev ? "Editar evento" : "Nuevo evento";
  $("f-tipo").value = ev?.tipo || "parcial";
  $("f-fecha").value = ev?.fecha || fecha || iso(new Date());
  llenarMaterias(ev?.materia || "");
  $("f-titulo").value = ev?.titulo || "";
  $("f-nota").value = ev?.nota || "";
  $("f-estado").value = ev?.estado || "sin";
  $("f-notas").value = ev?.notas || "";
  $("delBtn").classList.toggle("hidden", !ev);
  actualizarCampos();
  dlg.showModal();
}
$("addEvent").onclick = () => abrirDialogo(null);
$("cancelBtn").onclick = () => dlg.close();
$("delBtn").onclick = () => {
  if (!confirm("¿Eliminar este evento?")) return;
  eventos = eventos.filter(e => e.id !== editId); guardarEventos(); dlg.close(); renderCal();
};
$("form").addEventListener("submit", () => {
  const t = $("f-tipo").value;
  const data = {
    id: editId || uid(), tipo: t, fecha: $("f-fecha").value,
    materia: $("f-materia").value.trim(), titulo: $("f-titulo").value.trim(),
    nota: (t === "parcial" || t === "final") ? $("f-nota").value : "",
    estado: t === "tp" ? $("f-estado").value : "",
    notas: $("f-notas").value.trim()
  };
  eventos = editId ? eventos.map(e => e.id === editId ? data : e) : [...eventos, data];
  guardarEventos(); renderCal();
});

/* ---------- Archivos (IndexedDB) ---------- */
const dbp = new Promise((res, rej) => {
  const r = indexedDB.open("planner-archivos", 1);
  r.onupgradeneeded = () => { const d = r.result; d.createObjectStore("folders", {keyPath:"id"}); d.createObjectStore("files", {keyPath:"id"}); };
  r.onsuccess = () => res(r.result);
  r.onerror = () => rej(r.error);
});
const tx = (store, mode, fn) => dbp.then(db => new Promise((res, rej) => {
  const t = db.transaction(store, mode); const r = fn(t.objectStore(store));
  t.oncomplete = () => res(r && r.result); t.onerror = () => rej(t.error);
}));
let folders = [], files = [], folderActual = null;
async function cargarArchivos(){
  folders = await tx("folders", "readonly", s => s.getAll());
  files = await tx("files", "readonly", s => s.getAll());
  renderArch();
}
function tamano(b){ return b < 1024 ? b + " B" : b < 1048576 ? (b/1024).toFixed(0) + " KB" : (b/1048576).toFixed(1) + " MB"; }
function renderArch(){
  // migas de pan
  const c = $("crumbs"); c.innerHTML = "";
  const ruta = []; let f = folders.find(x => x.id === folderActual);
  while (f){ ruta.unshift(f); f = folders.find(x => x.id === f.parentId); }
  const mk = (txt, id) => { const b = document.createElement("button"); b.textContent = txt; b.onclick = () => { folderActual = id; renderArch(); }; return b; };
  c.appendChild(mk("Mis archivos", null));
  ruta.forEach(r => { const s = document.createElement("span"); s.textContent = "/"; c.append(s, mk(r.name, r.id)); });

  const cont = $("items"); cont.innerHTML = "";
  const subs = folders.filter(x => x.parentId === folderActual).sort((a,b) => a.name.localeCompare(b.name));
  const fls = files.filter(x => x.folderId === folderActual).sort((a,b) => a.name.localeCompare(b.name));
  if (!subs.length && !fls.length){ cont.innerHTML = '<div class="vacio">Carpeta vacía. Creá una carpeta (por ejemplo, una por materia) o subí archivos.</div>'; return; }

  subs.forEach(fo => {
    const d = document.createElement("div"); d.className = "item folder"; d.tabIndex = 0;
    d.innerHTML = '<span class="ico">📁</span><span class="name"></span><span class="meta"></span><button class="x" title="Eliminar carpeta" aria-label="Eliminar carpeta">✕</button>';
    d.querySelector(".name").textContent = fo.name;
    const n = folders.filter(x => x.parentId === fo.id).length + files.filter(x => x.folderId === fo.id).length;
    d.querySelector(".meta").textContent = n + (n === 1 ? " elemento" : " elementos");
    const abrir = () => { folderActual = fo.id; renderArch(); };
    d.onclick = abrir; d.onkeydown = e => { if (e.key === "Enter") abrir(); };
    d.querySelector(".x").onclick = async e => { e.stopPropagation(); if (confirm(`¿Eliminar "${fo.name}" y todo su contenido?`)) { await borrarCarpeta(fo.id); cargarArchivos(); } };
    cont.appendChild(d);
  });
  fls.forEach(fi => {
    const d = document.createElement("div"); d.className = "item";
    d.innerHTML = '<span class="ico">📄</span><span class="name"></span><span class="meta"></span><a href="#">Abrir / descargar</a><button class="x" title="Eliminar archivo" aria-label="Eliminar archivo">✕</button>';
    d.querySelector(".name").textContent = fi.name;
    d.querySelector(".meta").textContent = tamano(fi.size);
    d.querySelector("a").onclick = e => {
      e.preventDefault();
      const url = URL.createObjectURL(fi.blob);
      const a = document.createElement("a"); a.href = url; a.download = fi.name; a.click();
      setTimeout(() => URL.revokeObjectURL(url), 5000);
    };
    d.querySelector(".x").onclick = async () => { if (confirm(`¿Eliminar "${fi.name}"?`)) { await tx("files", "readwrite", s => s.delete(fi.id)); cargarArchivos(); } };
    cont.appendChild(d);
  });
}
async function borrarCarpeta(id){
  for (const sub of folders.filter(x => x.parentId === id)) await borrarCarpeta(sub.id);
  for (const fi of files.filter(x => x.folderId === id)) await tx("files", "readwrite", s => s.delete(fi.id));
  await tx("folders", "readwrite", s => s.delete(id));
}
$("newFolder").onclick = async () => {
  const name = prompt("Nombre de la carpeta:"); if (!name || !name.trim()) return;
  await tx("folders", "readwrite", s => s.add({id: uid(), name: name.trim(), parentId: folderActual}));
  cargarArchivos();
};
$("uploadBtn").onclick = () => $("fileInput").click();
$("fileInput").onchange = async e => {
  for (const f of e.target.files)
    await tx("files", "readwrite", s => s.add({id: uid(), folderId: folderActual, name: f.name, size: f.size, type: f.type, blob: f}));
  e.target.value = ""; cargarArchivos();
};

/* ---------- Copia de seguridad ---------- */
const blobToDataURL = b => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsDataURL(b); });

$("exportBtn").onclick = async () => {
  try {
    const fo = await tx("folders", "readonly", s => s.getAll());
    const fl = await tx("files", "readonly", s => s.getAll());
    const fs = await Promise.all(fl.map(async f => ({id: f.id, folderId: f.folderId, name: f.name, size: f.size, type: f.type, data: await blobToDataURL(f.blob)})));
    const data = {app: "planner", version: 1, eventos, materias, folders: fo, files: fs};
    const url = URL.createObjectURL(new Blob([JSON.stringify(data)], {type: "application/json"}));
    const a = document.createElement("a"); a.href = url; a.download = `planner-backup-${iso(new Date())}.json`; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  } catch(e){ alert("No se pudo exportar: " + e.message); }
};
$("importBtn").onclick = () => $("importInput").click();
$("importInput").onchange = async e => {
  const file = e.target.files[0]; e.target.value = ""; if (!file) return;
  try {
    const d = JSON.parse(await file.text());
    if (d.app !== "planner") throw new Error("El archivo no es una copia del planner.");
    // Se combina con lo que ya hay: no se borra nada
    const ids = new Set(eventos.map(x => x.id));
    (d.eventos || []).forEach(x => { if (!ids.has(x.id)) eventos.push(x); });
    (d.materias || []).forEach(m => { if (!materias.includes(m)) materias.push(m); });
    guardarEventos(); guardarMaterias();
    for (const fo of d.folders || []) await tx("folders", "readwrite", s => s.put(fo));
    for (const f of d.files || []) {
      const blob = await (await fetch(f.data)).blob();
      await tx("files", "readwrite", s => s.put({id: f.id, folderId: f.folderId, name: f.name, size: f.size, type: f.type, blob}));
    }
    renderCal(); await cargarArchivos();
    alert("Copia importada correctamente.");
  } catch(err){ alert("No se pudo importar: " + err.message); }
};

/* ---------- Pestañas ---------- */
function mostrar(v){
  $("view-cal").classList.toggle("hidden", v !== "cal");
  $("view-arch").classList.toggle("hidden", v !== "arch");
  $("tab-cal").setAttribute("aria-selected", v === "cal");
  $("tab-arch").setAttribute("aria-selected", v === "arch");
}
$("tab-cal").onclick = () => mostrar("cal");
$("tab-arch").onclick = () => mostrar("arch");

renderCal();
cargarArchivos().catch(() => { $("items").innerHTML = '<div class="vacio">No se pudo abrir el almacenamiento de archivos del navegador.</div>'; });
</script>
